e:["₹60,000 கடன், 12 மாதம், EMI ₹5,500 என்றால் மொத்தம் ₹66,000. வட்டி ₹6,000. (எடுத்துக்காட்டு எண்கள் மட்டுமே.)","A ₹60,000 loan with ₹5,500 EMI for 12 months costs ₹66,000, so interest is ₹6,000. (Illustrative numbers only.)"],
m:[["'No-cost EMI' என்றால் கட்டணமே இல்லை என்று நம்புவது.","Assuming 'no-cost EMI' has no hidden charges."],["சம்பளத்தில் பாதிக்கு மேல் EMI வைப்பது.","EMIs above half your income."]],
f:["செயலாக்கக் கட்டணம், முன்கூட்டிச் செலுத்தும் அபராதம் பற்றி எழுத்துப்பூர்வமாகக் கேளுங்கள்.","Ask in writing about processing and prepayment charges."],
u:["EMI = அசல் + வட்டி. மொத்தச் செலவைக் கணக்கிட்ட பின் முடிவு செய்யுங்கள்.","EMI = principal + interest. Check total cost before deciding."],src:[["RBI","https://www.rbi.org.in"]]},
{id:"upi",cat:"digital",lv:0,min:4,
t:["OTP, PIN மற்றும் UPI மோசடிகள்","OTP, PIN and UPI fraud"],
i:["மோசடிக்காரர்கள் உங்கள் பயத்தையும் அவசரத்தையும் பயன்படுத்துவார்கள்.","Fraudsters exploit fear and urgency."],
d:["OTP என்பது ஒருமுறை பயன்படும் ரகசிய எண். UPI PIN என்பது பணம் அனுப்ப மட்டும் நீங்கள் உள்ளிடும் ரகசிய எண்.","An OTP is a one-time secret code. A UPI PIN is the secret you enter only to send money."],
w:["ஒரு OTP சொன்னாலே கணக்குப் பணம் போகலாம்.","Sharing one OTP can empty your account."],
s:[["'பணம் பெற' ஒருபோதும் PIN தேவையில்லை — PIN அனுப்பும்போது மட்டுமே.","Receiving money never needs a PIN — only sending does."],["வங்கி ஊழியர் என்று அழைத்தால் OTP/PIN சொல்லாதீர்கள்.","Never tell a 'bank caller' your OTP/PIN."],["சந்தேகம் இருந்தால் அழைப்பை நிறுத்தி, வங்கியின் அதிகாரப்பூர்வ எண்ணை நீங்களே அழையுங்கள்.","Hang up and call the bank on its official number yourself."]],
e:["'உங்கள் KYC காலாவதியாகிவிட்டது, இந்த லிங்க்கில் அப்டேட் செய்யுங்கள்' என்ற SMS வந்தால், அது போலி லிங்க் ஆக இருக்கலாம்.","An SMS saying 'KYC expired, update via this link' may lead to a fake site."],
m:[["அவசரத்தில் லிங்கை அழுத்துவது.","Clicking links in a hurry."],["Screen-sharing ஆப் நிறுவச் சொன்னால் ஒப்புக்கொள்வது.","Installing a screen-sharing app on request."]],
f:["பணம் இழந்தால் உடனே வங்கியையும் 1930 உதவி எண்ணையும் அல்லது cybercrime.gov.in-ஐயும் தொடர்பு கொள்ளுங்கள்.","If money is lost, contact your bank and the 1930 helpline or cybercrime.gov.in immediately."],
u:["OTP, PIN, CVV யாரிடமும் பகிராதீர்கள்.","Never share OTP, PIN or CVV."],src:[["National Cyber Crime Portal","https://cybercrime.gov.in"],["RBI","https://www.rbi.org.in"]]},
{id:"ctc",cat:"work",lv:1,min:4,
t:["சம்பளம், CTC, Take-home — வித்தியாசம்","Salary, CTC and take-home pay"],
i:["வேலை சலுகையில் பெரிய எண் தெரியும்; கையில் கிடைப்பது வேறு.","The offer shows a big number; your bank credit is different."],
d:["CTC (Cost to Company) என்பது நிறுவனம் உங்களுக்காகச் செலவிடும் மொத்தத் தொகை. Take-home என்பது கழிவுகளுக்குப் பிறகு கணக்கில் வரும் தொகை.","CTC is the total cost a company bears for you. Take-home is what reaches your account after deductions."],
w:["CTC மட்டும் பார்த்து செலவுத் திட்டம் போட்டால் பற்றாக்குறை வரும்.","Planning on CTC alone leads to shortfalls."],
s:[["CTC-ல் உள்ள அடிப்படை, HRA, போனஸ் போன்றவற்றைப் பிரியுங்கள்.","Break CTC into basic, HRA, bonus etc."],["PF, வரி போன்ற கழிவுகளைக் கழியுங்கள்.","Subtract PF, tax and other deductions."],["மாதாந்திர Payslip-ல் சரிபார்க்கவும்.","Verify on your monthly payslip."]],
e:["CTC ₹4,00,000 என்றால் மாதம் ₹33,333 கிடைக்கும் என்று அர்த்தமில்லை; கழிவுகளுக்குப் பின் குறைவாக இருக்கும்.","A CTC of ₹4,00,000 does not mean ₹33,333 a month in hand; it will be lower after deductions."],
m:[["ஆஃபர் கடிதத்தைப் படிக்காமல் கையெழுத்திடுவது.","Signing without reading the offer letter."]],
f:["வரி விதிகள் மாறும்; அதிகாரப்பூர்வ வருமான வரித் தளத்தைப் பாருங்கள்.","Tax rules change; check the official Income Tax site."],
u:["CTC ≠ கையில் வரும் சம்பளம். Payslip-ஐ எப்போதும் சரிபாருங்கள்.","CTC ≠ in-hand pay. Always check your payslip."],src:[["Income Tax India","https://www.incometax.gov.in"]]},
{id:"warranty",cat:"consumer",lv:0,min:3,
t:["Warranty மற்றும் Guarantee","Warranty vs Guarantee"],
i:["பொருள் பழுதானால் யார் பொறுப்பு என்பதை இவை சொல்கின்றன.","They say who is responsible if a product fails."],
d:["இரண்டும் உற்பத்தியாளர்/விற்பவரின் எழுத்துப்பூர்வ உறுதிமொழிகள். விதிமுறைகள் பொருளுக்குப் பொருள் மாறும்; எனவே உங்கள் ஆவணத்தைப் படியுங்கள்.","Both are written promises by maker/seller. Terms vary, so read your document."],
w:["பில் இல்லாமல் உரிமை கோர முடியாமல் போகலாம்.","Without the bill you may not be able to claim."],
s:[["பில் மற்றும் Warranty அட்டையைப் பாதுகாக்கவும்.","Keep the bill and warranty card."],["என்னென்ன பழுதுகள் உள்ளடக்கம் என்று படிக்கவும்.","Read what is covered."],["பிரச்சினை வந்தால் எழுத்துப்பூர்வப் புகார் கொடுக்கவும்.","Complain in writing."]],
e:["ரவி வாங்கிய மிக்ஸி 8 மாதத்தில் பழுதானது. பில் வைத்திருந்ததால் இலவசப் பழுதுபார்ப்பு கிடைத்தது.","Ravi's mixer failed in 8 months; because he kept the bill, repair was free."],
m:[["பில்லைத் தூக்கி எறிவது.","Throwing away the bill."]],
f:["தீர்வு கிடைக்கவில்லை என்றால் தேசிய நுகர்வோர் உதவி மையத்தை அணுகலாம்.","If unresolved, approach the National Consumer Helpline."],
u:["பில் + Warranty அட்டை = உங்கள் பாதுகாப்பு.","Bill + warranty card = your protection."],src:[["Consumer Helpline","https://consumerhelpline.gov.in"]]},
{id:"digilocker",cat:"docs",lv:0,min:3,
t:["DigiLocker மற்றும் ஆவணப் பாதுகாப்பு","DigiLocker and protecting documents"],
i:["முக்கிய ஆவணங்களை டிஜிட்டலாகப் பாதுகாக்கும் அரசு சேவை.","A government service for keeping documents digitally."],
d:["DigiLocker என்பது இந்திய அரசின் டிஜிட்டல் ஆவணச் சேமிப்பு தளம்.","DigiLocker is the Government of India's digital document wallet."],
w:["ஆவணம் தொலைந்தாலும் டிஜிட்டல் நகல் கிடைக்கும்.","You still have a copy if the original is lost."],
s:[["அதிகாரப்பூர்வ ஆப்/தளத்தை மட்டும் பயன்படுத்துங்கள்.","Use only the official app/site."],["மொபைல் எண்ணுடன் பதிவு செய்யுங்கள்.","Register with your mobile number."],["தேவையான ஆவணங்களை இணைக்கவும்.","Link your documents."]],
e:["மாணவி கவிதா வேலை நேர்காணலுக்கு ஆதார், மதிப்பெண் சான்றிதழை ஃபோனிலேயே காட்டினார்.","Kavitha showed Aadhaar and mark sheets from her phone at an interview."],
m:[["ஆதார் எண்ணை சமூக வலைதளத்தில் பகிர்வது.","Posting the Aadhaar number on social media."]],
f:["ஆவண எண்களை நம்பகமற்றவர்களுடன் பகிராதீர்கள்.","Don't share document numbers with untrusted parties."],
u:["DigiLocker = பாதுகாப்பான டிஜிட்டல் ஆவண இடம்.","DigiLocker = a safe digital document space."],src:[["DigiLocker","https://www.digilocker.gov.in"]]},
{id:"supply",cat:"economy",lv:1,min:3,
t:["தேவை–வழங்கல் மற்றும் விலை மாற்றம்","Supply, demand and why prices change"],
i:["தக்காளி விலை ஏன் ஏறி இறங்குகிறது?","Why do tomato prices rise and fall?"],
d:["தேவை (Demand) அதிகமாகி வழங்கல் (Supply) குறைந்தால் விலை உயரும்; நேர்மாறாக விலை குறையும்.","When demand rises and supply falls, prices rise; the reverse lowers prices."],
w:["விலை மாற்றம் புரிந்தால் வாங்கும் நேரத்தைத் திட்டமிடலாம்.","Understanding prices helps you time purchases."],
s:[["மழை/வெள்ளத்தால் விளைச்சல் குறைகிறது.","Rain damages the harvest."],["சந்தைக்கு வரும் அளவு குறைகிறது.","Less reaches the market."],["விலை உயர்கிறது.","Prices rise."]],
e:["மழைக்காலத்தில் காய்கறி விலை உயர்வதும், அறுவடைக் காலத்தில் குறைவதும் இதனால்தான்.","Vegetables cost more in rains and less at harvest for this reason."],
m:[["ஒரு காரணத்தை மட்டும் குற்றம் சொல்வது.","Blaming only one cause."]],
f:["இது எளிமைப்படுத்தப்பட்ட மாதிரி; உண்மை நிலை பல காரணிகளைக் கொண்டது.","A simplified model; real markets have many factors."],
u:["தேவை↑ வழங்கல்↓ = விலை↑.","Demand up, supply down = price up."],src:[["RBI","https://www.rbi.org.in"]]},
{id:"calm",cat:"psych",lv:0,min:3,
t:["கருத்து வேறுபாட்டில் அமைதியாகப் பேசுவது","Talking calmly during disagreements"],
i:["வாதத்தில் வெல்வதை விட உறவைக் காப்பது முக்கியம்.","Protecting the relationship matters more than winning."],
d:["அமைதியான தொடர்பு என்பது உணர்ச்சியை நிர்வகித்து, கேட்டு, தெளிவாகப் பேசுவது.","Calm communication means managing emotion, listening and speaking clearly."],
w:["தவறான சொற்கள் உறவுகளை நீண்டகாலம் பாதிக்கும்.","Harsh words can damage relationships for long."],
s:[["ஆழ்ந்து மூச்சு விடுங்கள்.","Take a deep breath."],["'நீ' என்பதற்குப் பதில் 'நான் உணர்கிறேன்' என்று தொடங்குங்கள்.","Start with 'I feel' instead of 'you always'."],["முழுமையாகக் கேளுங்கள்.","Listen fully."]],
e:["நண்பர் தாமதமாக வந்தபோது 'நீ எப்போதும் இப்படித்தான்' என்பதற்குப் பதில் 'காத்திருந்தபோது கவலையாக இருந்தது' என்று சொன்னால் உரையாடல் சீராகும்.","Instead of 'you are always late', say 'I felt worried while waiting'."],
m:[["ஒருவரின் நடத்தையை வைத்து அவர் மனநிலையை உறுதியாக முடிவு செய்வது — சூழல் முக்கியம்.","Judging someone's mind from one behaviour; context matters."]],
f:["உளவியல் குறிப்புகள் உறுதியானவை அல்ல. இது மருத்துவ ஆலோசனை அல்ல.","Psychological signals are uncertain. This is not medical advice."],
u:["கேளுங்கள், அமைதியாகப் பேசுங்கள், முடிவுக்கு அவசரப்படாதீர்கள்.","Listen, speak calmly, don't jump to conclusions."],src:[]}
];

[["OTP-ஐ யாரிடம் பகிரலாம்?","Whom may you share your OTP with?"],[["வங்கி ஊழியர்","Bank staff"],["நண்பர்","A friend"],["யாரிடமும் இல்லை","Nobody"],["கூரியர் ஆள்","Courier"]],2,["உண்மையான வங்கி OTP கேட்காது.","A real bank never asks for your OTP."]],

[["CTC என்பது...","CTC is..."],[["கையில் வரும் சம்பளம்","In-hand salary"],["நிறுவனம் செலவிடும் மொத்தத் தொகை","Total cost to the company"],["வரி","Tax"],["போனஸ் மட்டும்","Only bonus"]],1,["கழிவுகளுக்கு முன் மொத்தத் தொகை.","It is the total before deductions."]],

const rel=L.filter(o=>o.id!==id&&o.cat===l.cat).concat(L.filter(o=>o.id!==id&&o.cat!==l.cat)).slice(0,3);
return `<article class="lesson"><div class="crumb"><a href="#/cat/${c[0]}">${c[1]} ${x(c[2])}</a></div><h1>${esc(x(l.t))}</h1><p class="meta">${l.min} ${x(T.min)} · ${x(T[l.lv?"inter":"beg"])} · ${x(T.reviewed)}</p>
<button class="btn sm" id="dn">${x(done?T.done:T.mark)}</button> <button class="btn sm alt" id="bk">${x(bm?T.bmd:T.bm)}</button>
<h2>${x(S[0])}</h2><p>${esc(x(l.i))}</p><h2>${x(S[1])}</h2><div class="box g">${esc(x(l.d))}</div><h2>${x(S[2])}</h2><p>${esc(x(l.w))}</p>
<h2>${x(S[3])}</h2><ol>${l.s.map(s=>`<li>${esc(x(s))}</li>`).join("")}</ol>
${l.tbl?`<div class="tw"><table><tr>${l.tbl[0].map(h=>`<th>${h}</th>`).join("")}</tr>${l.tbl.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(Array.isArray(c)?x(c):c)}</td>`).join("")}</tr>`).join("")}</table></div>`:""}
<h2>${x(S[4])}</h2><div class="box g">${esc(x(l.e))}</div><h2>${x(S[5])}</h2><ul>${l.m.map(s=>`<li>${esc(x(s))}</li>`).join("")}</ul>
<h2>${x(S[6])}</h2><div class="box w">${esc(x(l.f))}</div><h2>${x(S[7])}</h2><p><b>${esc(x(l.u))}</b></p>
<h2>${x(S[8])}</h2><div id="lq" class="card"></div>
<h2>${x(S[9])}</h2><div class="grid">${rel.map(lessonCard).join("")}</div>
${l.src.length?`<h2>${x(S[10])}</h2><ul>${l.src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener noreferrer">${s[0]}</a></li>`).join("")}</ul>`:""}</article>`}
function about(){return `<section class="lesson"><h1>${x(T.aboutT)}</h1><p>${x(T.aboutP)}</p><h2>${x(T.discT)}</h2><p>${x(T.disc)}</p></section>`}
function simple(t,p){return `<section class="lesson"><h1>${x(t)}</h1><p>${x(p)}</p></section>`}

/* ---------- QUIZ ---------- */
function quiz(box,list,save){
 const q=list[qz.i];
 if(!q){const best=store.get("best",0);if(save&&qz.s>best)store.set("best",qz.s);
  box.innerHTML=`<h3>${x(T.score)}: ${qz.s}/${list.length}</h3><p class="meta">${x(T.best)}: ${Math.max(store.get("best",0),save?qz.s:0)}/${Q.length}</p><button class="btn sm" id="qr">${x(T.again)}</button>`;
  $("#qr").onclick=()=>{qz={i:0,s:0,a:false};quiz(box,list,save)};return}
 box.innerHTML=`<p class="meta">${qz.i+1}/${list.length}</p><h3>${esc(x(q[0]))}</h3>${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${esc(x(o))}</button>`).join("")}<div id="fb" aria-live="polite"></div>`;
 box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(qz.a)return;qz.a=true;const i=+b.dataset.i;if(i===q[2])qz.s++;
  box.querySelectorAll(".opt").forEach((o,k)=>{o.disabled=true;if(k===q[2])o.classList.add("ok");else if(k===i)o.classList.add("no")});
  $("#fb").innerHTML=`<div class="box ${i===q[2]?"g":"w"}">${esc(x(q[3]))}</div><button class="btn sm" id="nx">${x(qz.i+1<list.length?T.next:T.chk)}</button>`;
  $("#nx").onclick=()=>{qz.i++;qz.a=false;quiz(box,list,save)}})}

/* ---------- ROUTER ---------- */
function render(){
 const h=location.hash.replace(/^#\/?/,"").split("/"),r=h[0]||"home";let html="";qz={i:0,s:0,a:false};
 try{
 if(r==="home")html=home();else if(r==="topics")html=topics();else if(r==="cat")html=topics(h[1]);
 else if(r==="lesson")html=lesson(h[1]);else if(r==="daily"){const d=L[Math.floor(Date.now()/864e5)%L.length];location.replace("#/lesson/"+d.id);return}
 else if(r==="quiz")html=`<section class="s"><h1>${x(T.test)}</h1><div id="qbox" class="card"></div></section>`;
 else if(r==="about")html=about();else if(r==="privacy")html=simple(T.privT,T.priv);else if(r==="disclaimer")html=simple(T.discT,T.disc);else html=home();
 }catch(e){console.error("Ulaga Arivu render error:",e);html=`<section class="lesson"><h1>${lang?"Something went wrong":"சிறிய தொழில்நுட்பப் பிழை"}</h1><p>${lang?"Please return home and try again. If the issue continues, refresh the page.":"முகப்புக்குத் திரும்பி மீண்டும் முயற்சிக்கவும். சிக்கல் தொடர்ந்தால் பக்கத்தைப் புதுப்பிக்கவும்."}</p><a class="btn" href="#/">${lang?"Go home":"முகப்புக்குச் செல்லுங்கள்"}</a></section>`}
 $("#main").innerHTML=html;document.documentElement.lang=lang?"en":"ta";
 const activeLesson=r==="lesson"?lessonOf(h[1]):null;document.title=activeLesson?`${x(activeLesson.t)} | ULAGA ARIVU`:(lang?"ULAGA ARIVU | உலக அறிவு":"உலக அறிவு | ULAGA ARIVU");
 chrome(r);
 if(r==="topics"||r==="cat"){const cat=r==="cat"?h[1]:"";filt(cat);$("#q").oninput=e=>{F.q=e.target.value;filt(cat)};$("#fc").onchange=e=>{if(cat){if(e.target.value){F.c="";location.hash="#/cat/"+e.target.value}else{F.c="";location.hash="#/topics"}}else{F.c=e.target.value;filt(cat)}};$("#fl").onchange=e=>{F.l=e.target.value;filt(cat)}}
 if($("#qbox"))quiz($("#qbox"),Q,true);
 if(r==="lesson"){const id=h[1],l=lessonOf(id);if(l){
  $("#dn").onclick=()=>{let d=store.get("done",[]);d=d.includes(id)?d.filter(i=>i!==id):d.concat(id);store.set("done",d);render()};
  $("#bk").onclick=()=>{let d=store.get("bm",[]);d=d.includes(id)?d.filter(i=>i!==id):d.concat(id);store.set("bm",d);render()};
  const idx={bank:[4,5,0],cards:[0,5,1],emi:[4,5,3],upi:[1,2,6],ctc:[3,4,0],warranty:[7,0,3],digilocker:[1,7,3],supply:[8,3,4],calm:[8,1,4]}[id]||[0,1,2];
  const pick=idx.map(i=>Q[i]);qz={i:0,s:0,a:false};quiz($("#lq"),pick,false)}}
 if($("#rst"))$("#rst").onclick=()=>{if(confirm(x(T.rconf))){["done","bm","last","best"].forEach(k=>{try{localStorage.removeItem("ua_"+k)}catch(e){}});render()}};
 window.scrollTo(0,0);
}
function chrome(r){
 const n=[["home","#/",T.home],["topics","#/topics",T.topics],["daily","#/daily",T.daily],["quiz","#/quiz",T.quiz],["about","#/about",T.about]];
 $("#nav").innerHTML=n.map(a=>`<a href="${a[1]}" class="${a[0]===r?"on":""}">${x(a[2])}</a>`).join("")+`<a href="#/topics" aria-label="Search" onclick="setTimeout(()=>document.getElementById('q')&&document.getElementById('q').focus(),50)">🔍</a><button class="ic" id="lg" aria-label="Language">${lang?"தமிழ்":"EN"}</button><a class="btn sm" href="#/topics">${x(T.start)}</a>`;
 $("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");
 $("#lg").onclick=()=>{lang=1-lang;try{localStorage.setItem("ua_lang",String(lang))}catch(e){}render()};
 $("#foot").innerHTML=`<div class="fg"><div><b>உலக அறிவு | ULAGA ARIVU</b><p>${x(T.tag)}</p></div><div><b>${x(T.cats)}</b><br>${CATS.map(c=>`<a href="#/cat/${c[0]}">${x(c[2])}</a><br>`).join("")}</div><div><a href="#/privacy">${x(T.privT)}</a><br><a href="#/disclaimer">${x(T.discT)}</a><br><a href="#/about">${x(T.aboutT)}</a><p>${x(T.contact)}</p></div></div><p class="meta" style="color:#9aa6c2">© 2026 Ulaga Arivu. ${x(T.disc)}</p>`;
}
$("#menu").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",String(o))};
$("#nav").addEventListener("click",e=>{if(e.target.closest("a")){$("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false")}});
window.addEventListener("hashchange",render);window.addEventListener("error",e=>console.error(e.message));render();
</script>
</body>
</html>
